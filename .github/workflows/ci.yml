name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run gallery:check
      - run: npm run demo -- --username demo --theme all
      - name: Validate all demo SVGs and gallery
        run: |
          test -s demo-output/README.md
          grep -q './dark/languages-by-repo.svg' demo-output/README.md
          grep -q './light/languages-by-commit.svg' demo-output/README.md
          for theme in dark light; do
            for kind in repo commit; do
              svg="demo-output/$theme/languages-by-$kind.svg"
              test -s "$svg"
              grep -q '<svg ' "$svg"
            done
          done
      - name: Test composite Action with live public GitHub data
        uses: ./
        with:
          username: naoiw
          top-n: '12'
          theme: all
          output-dir: live-cards
      - name: Cross-check language counts against GitHub REST
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify -- --username naoiw
      - name: Validate all live SVGs and gallery
        run: |
          test -s live-cards/README.md
          grep -q './dark/languages-by-repo.svg' live-cards/README.md
          grep -q './light/languages-by-commit.svg' live-cards/README.md
          for theme in dark light; do
            for kind in repo commit; do
              svg="live-cards/$theme/languages-by-$kind.svg"
              test -s "$svg"
              grep -q '<svg ' "$svg"
            done
          done
      - name: Upload live preview SVGs and gallery
        uses: actions/upload-artifact@v7
        with:
          name: language-cards-live-preview
          path: |
            live-cards/**/*.svg
            live-cards/README.md
          retention-days: 7
