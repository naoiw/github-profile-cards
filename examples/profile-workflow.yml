# Copy into your USERNAME/USERNAME repository at .github/workflows/profile-cards.yml
name: Update profile cards

on:
  schedule:
    - cron: '52 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin this workflow to a stable version; use @v1 for future v1-compatible updates.
      - uses: naoiw/github-profile-cards@v1.0.0
        with:
          username: ${{ github.repository_owner }}
          top-n: '12'
          chart: donut
          theme: all
          output-dir: profile-card-output
          # Optional for private/restricted GraphQL contributions:
          # token: ${{ secrets.PROFILE_CARDS_TOKEN }}
      - name: Commit generated SVGs and gallery
        shell: bash
        run: |
          git add profile-card-output/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile cards'
          git push
