name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run check
      - run: npm test
      - run: npm run gallery:check
      - run: npm run demo -- --username demo --theme all
      - name: Validate all demo SVGs
        run: |
          for theme in dark light; do
            for kind in repo commit; do
              svg="profile-card-output/$theme/languages-by-$kind.svg"
              test -s "$svg"
              grep -q '<svg ' "$svg"
            done
          done
      - name: Test composite Action with live public GitHub data
        uses: ./
        with:
          username: naoiw
          top-n: '12'
          theme: all
          output-dir: live-cards
      - name: Validate all live SVGs
        run: |
          for theme in dark light; do
            for kind in repo commit; do
              svg="live-cards/$theme/languages-by-$kind.svg"
              test -s "$svg"
              grep -q '<svg ' "$svg"
            done
          done
      - name: Upload live preview SVGs
        uses: actions/upload-artifact@v7
        with:
          name: language-cards-live-preview
          path: live-cards/**/*.svg
          retention-days: 7
